name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_backup:
        description: 'Test the backup source (pretend 365Scores is down)'
        type: boolean
        default: false
  # Refresh the data every 15 minutes (GitHub may run it a few minutes late).
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch data from 365Scores
        run: node scripts/fetch-data.mjs
        timeout-minutes: 8
        env:
          # Optional: better Hebrew news summaries. Add it under Settings → Secrets → Actions.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_BACKUP: ${{ inputs.force_backup && '1' || '' }}
      - run: npm run build
      # SPA fallback so deep links (e.g. /Barca/matches) load the app
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Robot summary
        if: always()
        run: cat robot.log || true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
